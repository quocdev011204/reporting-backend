name: Deploy Backend to VPS # Tên workflow

on:
  push:
    branches:
      - main # Trigger khi push lên main

jobs:
  deploy:
    runs-on: ubuntu-latest # Máy ảo GitHub chạy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd /root/reporting-backend
            git pull origin main
            npm install
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            pm2 reload reporting-backend
