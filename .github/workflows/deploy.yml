name: Deploy Backend to VPS # Tên workflow

on:
  push:
    branches:
      - main # Trigger khi push lên main

jobs:
  deploy:
    runs-on: ubuntu-latest # Máy ảo GitHub chạy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            echo "Starting deployment..."
            cd /root/reporting-backend
            echo "Current directory: $(pwd)"
            git fetch origin
            git checkout main
            git pull origin main || { echo "Git pull failed"; exit 1; }
            npm install || { echo "npm install failed"; exit 1; }
            npx prisma generate || { echo "Prisma generate failed"; exit 1; }
            npx prisma migrate deploy || { echo "Prisma migrate failed"; exit 1; }
            npm run build || { echo "Build failed"; exit 1; }
            pm2 reload reporting-backend || { echo "PM2 reload failed"; exit 1; }
            echo "Deployment completed"
